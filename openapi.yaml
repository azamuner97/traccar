openapi: 3.1.0
info:
  title: Traccar
  description: Traccar GPS tracking server API documentation. To use the API you need to have a server instance. For testing purposes you can use one of free [demo servers](https://www.traccar.org/demo-server/). For production use you can install your own server or get a [subscription service](https://www.traccar.org/product/tracking-server/).
  contact:
    name: Traccar Support
    url: https://www.traccar.org/
    email: support@traccar.org
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: '6.15.3'
servers:
  - url: https://demo.traccar.org/api
    description: Demo Server 1
  - url: https://demo2.traccar.org/api
    description: Demo Server 2
  - url: https://demo3.traccar.org/api
    description: Demo Server 3
  - url: https://demo4.traccar.org/api
    description: Demo Server 4
  - url: https://server.traccar.org/api
    description: Subscription Server
  - url: http://{host}:{port}/api
    description: Other Server
    variables:
      host:
        default: localhost
      port:
        enum:
          - '8082'
          - '80'
        default: '8082'
security:
  - BasicAuth: []
  - ApiKey: []
tags:
  - name: Server
    description: Server information
  - name: Session
    description: User session management
  - name: Devices
    description: Device management
  - name: Groups
    description: Group management
  - name: Share
    description: Share devices and groups
  - name: Users
    description: User management
  - name: Permissions
    description: User permissions and other object linking
  - name: Positions
    description: Retrieving raw location information
  - name: Events
    description: Retrieving event information
  - name: Reports
    description: Reports generation
  - name: Notifications
    description: User notifications management
  - name: Geofences
    description: Geofence management
  - name: Commands
    description: Sending commands to devices and stored command management
  - name: Attributes
    description: Computed attributes management
  - name: Drivers
    description: Drivers management
  - name: Maintenance
    description: Maintenance management
  - name: Calendars
    description: Calendar management
  - name: Statistics
    description: Retrieving server statistics
  - name: Health
    description: Checking server health status
  - name: Orders
    description: Order management
  - name: Audit
    description: Audit log access
  - name: Password
    description: Password reset flow
  - name: Stream
    description: Live video streaming
  - name: Game Sessions
    description: >-
      Sessions, settings, members, resource rows, documents, timetable and logs (operators only). The game endpoints
      describe game data model 2 (game-session API version 5): each participant is a member with a stable ID, typed
      tables hold the game state, and the server computes every member's status. Operators are Traccar
      administrators. Members are resolved from the caller's account; an account without membership gets 403 from
      every member endpoint. Every time is an ISO-8601 instant in UTC. Players and supporters never receive member
      state revisions, ping sources, other members' fake plans or inventories, bound run references, or anything
      that names a speedhunt's target: a target and a non-target get identical answers.
  - name: Game Effects
    description: Requests, jokers, effects deliveries and the operator snapshot (operators only)
  - name: Game Members
    description: >-
      The signed-in member's status, speedhunt history, requests, jokers and timetable pings, computed from the typed
      game tables by role.
  - name: Game Notifications
    description: The notification journal, keyed by game session
  - name: Game Proximity
    description: Participant proximity grants and circles, keyed by game session; no generation
  - name: Game Controller
    description: >-
      Server-wide controller lease for Traccar Tool (administrators only). Fenced requests carry the current
      controllerEpoch in the X-Game-Controller-Epoch header and are refused with 423 otherwise. Fenced are, for any
      session, effects, timetable progress, members/*, resources/*, checkpoints/*, requests/* and jokers/*; every
      write of the executing session; writes to /game-notifications and /game-proximity; and - while a lease is
      held - standard mutations (devices, groups, users, permissions, geofences, DELETE /positions) of the Traccar
      resources a session owns (members' accounts and trackers, mirrors, groups, geofences), and
      /notifications/send/* reaching members of the executing session. Users may always update their own account.
      A request that carries the header must carry the current epoch, whatever it changes. A change of control
      ends every open game request.
paths:
  /audit:
    get:
      operationId: getAudit
      summary: Fetch audit log Actions
      description: Admin only. Returns Actions performed in the given time window.
      tags:
        - Audit
      parameters:
        - name: from
          in: query
          description: in ISO 8601 format. eg. `1963-11-22T18:30:00Z`
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: in ISO 8601 format. eg. `1963-11-22T18:30:00Z`
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Action'
        '401':
          description: Unauthorized
          content: {}
  /health:
    get:
      operationId: getHealth
      summary: Check server health
      description: Return plain text status for basic uptime monitoring
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
              example: OK
        '500':
          description: Service is unavailable
          content: {}
        '400':
          description: Bad request
          content: {}
  /commands:
    get:
      operationId: getCommands
      summary: Fetch a list of Saved Commands
      tags:
        - Commands
      description: Without params, it returns a list of Saved Commands the user has access to
      parameters:
        - name: all
          in: query
          description: Can only be used by admins or managers to fetch all entities
          schema:
            type: boolean
        - name: userId
          in: query
          description: Standard users can use this only with their own _userId_
          schema:
            type: integer
        - name: deviceId
          in: query
          description: Standard users can use this only with _deviceId_s, they have access to
          schema:
            type: integer
        - name: groupId
          in: query
          description: >-
            Standard users can use this only with _groupId_s, they have access
            to
          schema:
            type: integer
        - name: refresh
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          description: Limit the number of returned results
          schema:
            type: integer
        - name: offset
          in: query
          description: Offset for pagination
          schema:
            type: integer
        - name: keyword
          in: query
          description: Search keyword filter
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Command'
        '401':
          description: Unauthorized
          content: {}
    post:
      operationId: postCommands
      summary: Create a Saved Command
      tags:
        - Commands
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Command'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command'
        '401':
          description: Unauthorized
          content: {}
        '400':
          description: Bad request
          content: {}
  /commands/{id}:
    get:
      operationId: getCommandsId
      summary: Fetch a Saved Command
      tags:
        - Commands
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command'
        '401':
          description: Unauthorized
          content: {}
        '404':
          description: Not found
          content: {}
    put:
      operationId: putCommandsId
      summary: Update a Saved Command
      tags:
        - Commands
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Command'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command'
        '401':
          description: Unauthorized
          content: {}
        '400':
          description: Bad request
          content: {}
    delete:
      operationId: deleteCommandsId
      summary: Delete a Saved Command
      tags:
        - Commands
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No Content
          content: {}
        '401':
          description: Unauthorized
          content: {}
  /commands/send:
    get:
      operationId: getCommandsSend
      summary: Fetch a list of Saved Commands supported by Device at the moment
      description: >-
        Return a list of saved commands linked to Device and its groups,
        filtered by current Device protocol support
      tags:
        - Commands
      parameters:
        - name: deviceId
          in: query
          description: >-
            Standard users can use this only with _deviceId_s, they have access
            to
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Command'
        '400':
          description: Could happen when the user doesn't have permission for the device
          content: {}
    post:
      operationId: postCommandsSend
      summary: Dispatch commands to device
      description: Dispatch a new command or Saved Command if _body.id_ set
      tags:
        - Commands
      parameters:
        - name: groupId
          in: query
          description: Send the command to all devices in the group
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Command'
        required: true
      responses:
        '200':
          description: Command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command'
        '202':
          description: Command queued
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/QueuedCommand'
                  - type: array
                    items:
                      $ref: '#/components/schemas/QueuedCommand'
        '400':
          description: >-
            Could happen when the user doesn't have permission or an incorrect
            command _type_ for the device
          content: {}
  /commands/types:
    get:
      operationId: getCommandsTypes
      summary: >-
        Fetch a list of available Commands for the Device or all possible
        Commands if Device ommited
      tags:
        - Commands
      parameters:
        - name: deviceId
          in: query
          description: >-
            Internal device identifier. Only works if device has already
            reported some locations
          schema:
            type: integer
        - name: textChannel
          in: query
          description: >-
            When `true` return SMS commands. If not specified or `false` return
            data commands
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommandType'
        '400':
          description: >-
            Could happen when trying to fetch from a device the user does not
            have permission
          content: {}
  /orders:
    get:
      operationId: getOrders
      summary: Fetch a list of Orders
      description: Without params, it returns a list of Orders the user has access to
      tags:
        - Orders
      parameters:
        - name: all
          in: query
          description: Can only be used by admins or managers to fetch all entities
          schema:
            type: boolean
        - name: userId
          in: query
          description: Standard users can use this only with their own _userId_
          schema:
            type: integer
        - name: excludeAttributes
          in: query
          description: Skip returning the attributes map
          schema:
            type: boolean
        - name: limit
          in: query
          description: Limit the number of returned results
          schema:
            type: integer
        - name: offset
          in: query
          description: Offset for pagination
          schema:
            type: integer
        - name: keyword
          in: query
          description: Search keyword filter
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
          content: {}
    post:
      operationId: postOrders
      summary: Create an Order
      tags:
        - Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
          content: {}
        '400':
          description: Bad request
          content: {}
  /orders/{id}:
    get:
      operationId: getOrdersId
      summary: Fetch an Order
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
          content: {}
        '404':
          description: Not found
          content: {}
    put:
      operationId: putOrdersId
      summary: Update an Order
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
          content: {}
        '400':
          description: Bad request
          content: {}
    delete:
      operationId: deleteOrdersId
      summary: Delete an Order
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No Content
          content: {}
        '401':
          description: Unauthorized
          content: {}
  /devices:
    get:
      operationId: getDevices
      summary: Fetch a list of Devices
      description: Without any params, returns a list of the user's devices
      tags:
        - Devices
      parameters:
        - name: all
          in: query
          description: Can only be used by admins or managers to fetch all entities
          schema:
            type: boolean
        - name: userId
          in: query
          description: Standard users can use this only with their own _userId_
          schema:
            type: integer
        - name: id
          in: query
          description: >-
            To fetch one or more devices. Multiple params can be passed like
            `id=31&id=42`
          schema:
            type: integer
        - name: uniqueId
          in: query
          description: >-
            To fetch one or more devices. Multiple params can be passed like
            `uniqueId=333331&uniqieId=44442`
          schema:
            type: string
        - name: excludeAttributes
          in: query
          description: Exclude attributes field from device payload
          schema:
            type: boolean
        - name: limit
          in: query
          description: Limit the number of returned results
          schema:
            type: integer
        - name: offset
          in: query
          description: Offset for pagination
          schema:
            type: integer
        - name: keyword
          in: query
          description: Search keyword filter (searches name, uniqueId, phone, model, contact)
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '400':
          description: No permission
          content: {}
    post:
      operationId: postDevices
      summary: Create a Device
      tags:
        - Devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Device'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          description: Unauthorized
          content: {}
        '400':
          description: Bad request
          content: {}
  /devices/{id}:
    get:
      operationId: getDevicesId
      summary: Fetch a Device
      tags:
        - Devices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          description: Unauthorized
          content: {}
        '404':
          description: Not found
          content: {}
    put:
      operationId: putDevicesId
      summary: Update a Device
      tags:
        - Devices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Device'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          description: Unauthorized
          content: {}
        '400':
          description: Bad request
          content: {}
        '422':
          description: >-
            Mirror-only hunter access: moving it to this group would let a hunter of a game session with
            break or fake jokers see a real participant tracker
          content: {}
    delete:
      operationId: deleteDevicesId
      summary: Delete a Device
      tags:
        - Devices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No Content
          content: {}
        '401':
          description: Unauthorized
          content: {}
  /devices/{id}/accumulators:
    put:
      operationId: putDevicesIdAccumulators
      summary: Update total distance and hours of the Device
      tags:
        - Devices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAccumulators'
        required: true
      responses:
        '204':
          description: No Content
          content: {}
        '401':
          description: Unauthorized
          content: {}
        '400':
          description: Bad request
          content: {}
  /devices/{id}/image:
    post:
      operationId: postDevicesIdImage
      summary: Upload/Update Device image
      tags:
        - Devices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          image/*:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
              example: device.png
        '400':
          description: Invalid image type or size
          content: {}
        '404':
          description: Device not found
          content: {}
  /share/device:
    post:
      operationId: postShareDevice
      summary: Share device location
      tags:
        - Share
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - deviceId
                - expiration
              properties:
                deviceId:
                  type: integer
                expiration:
                  type: string
                  format: date-time
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
              example: eyJhbGciOi...
        '403':
          description: Sharing is disabled or temporary user
          content: {}
  /share/group:
    post:
      operationId: postShareGroup
      summary: Share group devices
      tags:
        - Share
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - groupId
                - expiration
              properties:
                groupId:
                  type: integer
                expiration:
                  type: string
                  format: date-time
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
              example: eyJhbGciOi...
        '403':
          description: Sharing is disabled or temporary user
          content: {}
  /groups:
    get:
      operationId: getGroups
      summary: Fetch a list of Groups
      description: Without any params, returns a list of the Groups the user belongs to
      tags:
        - Groups
      parameters:
        - name: all
          in: query
          description: Can only be used by admins or managers to fetch all entities
          schema:
            type: boolean
        - name: userId
          in: query
          description: Standard users can use this only with their own _userId_
          schema:
            type: integer
        - name: limit
          in: query
          description: Limit the number of returned results
          schema:
            type: integer
        - name: offset
          in: query
          description: Offset for pagination
          schema:
            type: integer
        - name: keyword
          in: query
          description: Search keyword filter
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '401':
          description: Unauthorized
          content: {}
    post:
      operationId: postGroups
      summary: Create a Group
      tags:
        - Groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: No permission
          content: {}
  /groups/{id}:
    get:
      operationId: getGroupsId
      summary: Fetch a Group
      tags:
        - Groups
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          description: Unauthorized
          content: {}
        '404':
          description: Not found
          content: {}
    put:
      operationId: putGroupsId
      summary: Update a Group
      tags:
        - Groups
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          description: Unauthorized
          content: {}
        '400':
          description: Bad request
          content: {}
        '422':
          description: >-
            Mirror-only hunter access: moving it to this group would let a hunter of a game session with
            break or fake jokers see a real participant tracker
          content: {}
    delete:
      operationId: deleteGroupsId
      summary: Delete a Group
      tags:
        - Groups
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No Content
          content: {}
        '401':
          description: Unauthorized
          content: {}
  /password/reset:
    post:
      operationId: postPasswordReset
      summary: Send password reset email
      description: Always responds with `200` regardless of whether the email matches a user.
      tags:
        - Password
      security: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
        required: true
      responses:
        '200':
          description: OK
          content: {}
        '400':
          description: Bad request
          content: {}
  /password/update:
    post:
      operationId: postPasswordUpdate
      summary: Set a new password using a reset token
      tags:
        - Password
      security: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  format: password
        required: true
      responses:
        '200':
          description: OK
          content: {}
        '404':
          description: User not found
          content: {}
  /permissions:
    get:
      operationId: getPermissions
      summary: Fetch permission links between Objects
      description: >-
        Provide exactly two `*Id` query parameters matching the Permission body
        shape (e.g. `reportId` and `deviceId`). Use `0` on a side to mean
        "any", e.g. `?reportId=5&deviceId=0` lists all devices linked to
        report 5. At least one side must be non-zero.
      tags:
        - Permissions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
        '400':
          description: Bad request
          content: {}
    post:
      operationId: postPermissions
      summary: Link an Object to another Object
      tags:
        - Permissions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Permission'
        required: true
      responses:
        '204':
          description: No Content
          content: {}
        '400':
          description: No permission
          content: {}
        '422':
          description: >-
            Mirror-only hunter access: the change would let a hunter of a game session with break or fake
            jokers see a real participant tracker, directly or through a group
          content: {}
    delete:
      operationId: deletePermissions
      summary: Unlink an Object from another Object
      tags:
        - Permissions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Permission'
        required: true
      responses:
        '204':
          description: No Content
          content: {}
        '401':
          description: Unauthorized
          content: {}
