        audience:
          type: string
        occurredAt:
          $ref: '#/components/schemas/Time'
        timeZone:
          type: string
        message:
          type: string
          maxLength: 8192
        recipientMemberId:
          $ref: '#/components/schemas/NullableId'
        sourceMemberId:
          $ref: '#/components/schemas/NullableId'
    GameNotificationEntry:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        audience:
          type: string
        occurredAt:
          $ref: '#/components/schemas/Time'
        timeZone:
          type: string
        message:
          type: string
        recipientMemberId:
          $ref: '#/components/schemas/NullableId'
        recipientLabel:
          type: [string, 'null']
        sourceMemberId:
          $ref: '#/components/schemas/NullableId'
        sourceLabel:
          type: [string, 'null']
        generation:
          type: string
        createdAt:
          $ref: '#/components/schemas/Time'
    GameNotificationPage:
      type: object
      properties:
        generation:
          type: [string, 'null']
        resetAt:
          $ref: '#/components/schemas/NullableTime'
        items:
          type: array
          items:
            $ref: '#/components/schemas/GameNotificationEntry'
        nextCursor:
          type: string
        hasMore:
          type: boolean
    GameNotificationHistoryPage:
      type: object
      properties:
        gameSessionId:
          $ref: '#/components/schemas/Id'
        items:
          type: array
          items:
            $ref: '#/components/schemas/GameNotificationEntry'
        nextCursor:
          type: string
        hasMore:
          type: boolean
    GameNotificationCreate:
      type: object
      required: [gameSessionId, generation, alert]
      properties:
        gameSessionId:
          $ref: '#/components/schemas/Id'
        generation:
          type: string
          format: uuid
        alert:
          $ref: '#/components/schemas/GameNotificationAlert'
    GameNotificationCreation:
      type: object
      properties:
        generation:
          type: string
        item:
          $ref: '#/components/schemas/GameNotificationEntry'
        created:
          type: boolean
    GameNotificationState:
      type: object
      properties:
        gameSessionId:
          $ref: '#/components/schemas/Id'
        generation:
          type: string
        resetAt:
          $ref: '#/components/schemas/Time'
        revision:
          type: integer
    GameNotificationReset:
      type: object
      required: [expectedGeneration, replacementGeneration]
      properties:
        expectedGeneration:
          type: string
          format: uuid
        replacementGeneration:
          type: string
          format: uuid
    GameProximityGrantInput:
      type: object
      required: [episodeId, recipientMemberId, targetMemberId, expiresAt]
      description: Grants come in reciprocal pairs with one episodeId and one expiry
      properties:
        episodeId:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        recipientMemberId:
          $ref: '#/components/schemas/Id'
        targetMemberId:
          $ref: '#/components/schemas/Id'
        expiresAt:
          $ref: '#/components/schemas/Time'
    GameProximityCircleInput:
      type: object
      required: [id, latitude, longitude, diameterMeters, expiresAt, memberIds]
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        latitude:
          type: number
        longitude:
          type: number
        diameterMeters:
          type: number
          exclusiveMinimum: 0
        expiresAt:
          $ref: '#/components/schemas/Time'
        memberIds:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/Id'
    GameProximityReplace:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision:
          type: integer
          minimum: 0
        grants:
          type: array
          items:
            $ref: '#/components/schemas/GameProximityGrantInput'
        circles:
          type: array
          items:
            $ref: '#/components/schemas/GameProximityCircleInput'
    GameProximitySnapshot:
      type: object
      properties:
        revision:
          type: integer
        grants:
          type: array
          items:
            type: object
            properties:
              episodeId:
                type: string
              recipientMemberId:
                $ref: '#/components/schemas/Id'
              targetMemberId:
                $ref: '#/components/schemas/Id'
              userId:
                $ref: '#/components/schemas/Id'
              deviceId:
                $ref: '#/components/schemas/Id'
              expiresAt:
                $ref: '#/components/schemas/Time'
        circles:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/GameProximityPublicCircle'
              - type: object
                properties:
                  memberIds:
                    type: array
                    items:
                      $ref: '#/components/schemas/Id'
    GameProximityPublicCircle:
      type: object
      properties:
        id:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        diameterMeters:
          type: number
        playerCount:
          type: integer
        supporterCount:
          type: integer
        expiresAt:
          $ref: '#/components/schemas/Time'
    GameProximityAccess:
      type: object
      properties:
        memberId:
          $ref: '#/components/schemas/Id'
          description: The target member
        deviceId:
          $ref: '#/components/schemas/Id'
          description: The target member's tracker
        expiresAt:
          $ref: '#/components/schemas/Time'

  parameters:
    GameControllerEpoch:
      name: X-Game-Controller-Epoch
      in: header
      required: false
      description: controllerEpoch of the lease held by the calling Tool instance
      schema:
        type: integer
        format: int64
    GameSessionId:
      name: id
      in: path
      required: true
      description: Game-session ID
      schema:
        type: integer
        format: int64
    GameMemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    GameRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    GameResourceKind:
      name: kind
      in: path
      required: true
      description: Unknown kinds answer 404
      schema:
        type: string
        enum: [mirrors, groups, geofences]
    GameResourceRowId:
      name: rowId
      in: path
      required: true
      description: The game resource row, not the Traccar resource
      schema:
        type: integer
        format: int64
    ControllerEpoch:
      name: X-Game-Controller-Epoch
      in: header
      description: The current controller epoch; required (423 without it)
      schema:
        type: integer
        format: int64
    After:
      name: after
      in: query
      description: The nextCursor of the previous page
      schema:
        type: string
        pattern: '^[0-9]{1,18}$'
    NotificationLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100

  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    ApiKey:
      type: http
      scheme: bearer
