      properties:
        id:
          type: integer
          format: int64
        epoch:
          type: integer
          format: int64
        event:
          type: string
          enum: [acquired, takeover, takenOver, released, expired, serverRestart, executing, stoppedExecuting,
                 unfencedEdit]
        userId:
          type: [integer, 'null']
          format: int64
        userLabel:
          type: [string, 'null']
        instanceId:
          type: [string, 'null']
        label:
          type: [string, 'null']
        gameSessionId:
          type: [integer, 'null']
          format: int64
