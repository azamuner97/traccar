          type: [integer, 'null']
          format: int64
          description: Session the active controller executes
        acquiredAt:
          type: [string, 'null']
          format: date-time
        renewedAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        serverTime:
          type: string
          format: date-time
        leaseSeconds:
          type: integer
        renewSeconds:
          type: integer
