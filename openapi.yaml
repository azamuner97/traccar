      properties:
        epoch:
          type: integer
          format: int64
          description: controllerEpoch of the latest acquisition; it only increases, also across restarts
        state:
          type: string
          enum: [free, active, expired, released, restarted]
        active:
          type: boolean
        holder:
          oneOf:
            - $ref: '#/components/schemas/GameControllerHolder'
            - type: 'null'
