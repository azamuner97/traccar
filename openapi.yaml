      responses:
        '200':
          $ref: '#/components/responses/Request'
        '403':
          $ref: '#/components/responses/NoMembership'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /game-jokers:
    get:
      operationId: getGameJokers
      summary: Own jokers of a player or supporter, or the hunters' pool of speedhunt jokers; spectators get 403
      tags: [Game Members]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameOwnJokers'
        '403':
          $ref: '#/components/responses/NoMembership'
  /game-jokers/reservations/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: cancelGameJokerReservation
      summary: The owner cancels an armed fake or planned break that has not taken effect
      description: Another owner's reservation answers exactly like a missing one (404).
      tags: [Game Members]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameJokerReservation'
        '403':
          $ref: '#/components/responses/NoMembership'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /game-timetable:
    get:
      operationId: getGameTimetablePings
      summary: Timetable pings without cell content
      description: >-
        Players and supporters get their own pings that can carry a fake (with fakeAllowed), spectators every ping
        that reaches hunters, hunters only the times of those pings (GameTimetableSlot).
      tags: [Game Members]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  anyOf:
                    - $ref: '#/components/schemas/GameTimetablePing'
                    - $ref: '#/components/schemas/GameTimetableSlot'
        '403':
          $ref: '#/components/responses/NoMembership'
  /game-notifications:
    get:
      operationId: getGameNotifications
      summary: One page of the current generation
      description: >-
        An administrator naming gameSessionId reads everything of that session; anyone else reads their own
        session's alerts as its member (session alerts, their role group's alerts, targeted alerts about themselves
        and live-recipient alerts for their role). A member naming another session gets 403.
      tags: [Game Notifications]
      parameters:
        - name: gameSessionId
          in: query
          schema:
            type: integer
            format: int64
        - name: generation
          in: query
          description: The generation the client holds; 409 when it changed
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/NotificationLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameNotificationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/NoMembership'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      operationId: createGameNotification
      summary: Archives one alert in the current generation (operators, fenced)
      tags: [Game Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameNotificationCreate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameNotificationCreation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
  /game-notifications/history:
    get:
      operationId: getGameNotificationHistory
      summary: Operator history of a session across generations
      tags: [Game Notifications]
      parameters:
        - name: gameSessionId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/NotificationLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameNotificationHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /game-notifications/session/{id}:
    parameters:
      - $ref: '#/components/parameters/GameSessionId'
    get:
      operationId: getGameNotificationState
      summary: The stream state of a session (null before its first generation)
      tags: [Game Notifications]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GameNotificationState'
                  - type: 'null'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: initializeGameNotifications
      summary: Starts the session's first generation; an initialized session keeps its own (fenced)
      tags: [Game Notifications]
      responses:
        '200':
          $ref: '#/components/responses/NotificationState'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/Locked'
  /game-notifications/session/{id}/reset:
    parameters:
      - $ref: '#/components/parameters/GameSessionId'
    post:
      operationId: resetGameNotifications
      summary: Starts a new generation and deletes the session's history (fenced)
      tags: [Game Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameNotificationReset'
      responses:
        '200':
          $ref: '#/components/responses/NotificationState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
  /game-proximity/session/{id}:
    parameters:
      - $ref: '#/components/parameters/GameSessionId'
    get:
      operationId: getGameProximity
      summary: The operators' view - revision, unexpired grants and circles with their members
      tags: [Game Proximity]
      responses:
        '200':
          $ref: '#/components/responses/Proximity'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: replaceGameProximity
      summary: Replaces the published content based on its revision; the server assigns the next (fenced)
      tags: [Game Proximity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameProximityReplace'
      responses:
        '200':
          $ref: '#/components/responses/Proximity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
  /game-proximity/session/{id}/reset:
    parameters:
      - $ref: '#/components/parameters/GameSessionId'
    post:
      operationId: resetGameProximity
      summary: Publishes empty content with the next revision (fenced)
      tags: [Game Proximity]
      responses:
        '200':
          $ref: '#/components/responses/Proximity'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/Locked'
  /game-proximity/circles:
    get:
      operationId: getGameProximityCircles
      summary: The circles of the caller's session, without member identities (hunters and the spectator)
      tags: [Game Proximity]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameProximityPublicCircle'
        '403':
          $ref: '#/components/responses/NoMembership'
  /game-proximity/access:
    get:
      operationId: getGameProximityAccess
      summary: The caller's own temporary access to other participants' trackers (players and supporters)
      description: Trackers the account sees permanently anyway are left out.
      tags: [Game Proximity]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameProximityAccess'
        '403':
          $ref: '#/components/responses/NoMembership'
  /game-controller:
    get:
      operationId: getGameController
      summary: Fetch the controller lease
      tags:
        - Game Controller
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameControllerLease'
  /game-controller/acquire:
    post:
      operationId: acquireGameController
      summary: Acquire a free or expired controller lease
      description: Repeating the call from the instance that holds the active lease returns it unchanged.
      tags:
        - Game Controller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameControllerInstance'
      responses:
        '200':
          description: Acquired lease and unfenced administrator edits since the previous acquisition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameControllerAcquisition'
        '423':
          description: Another Tool instance holds the lease
          content: {}
  /game-controller/takeover:
    post:
      operationId: takeOverGameController
      summary: Forced takeover with a new controller epoch
      tags:
        - Game Controller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameControllerInstance'
      responses:
        '200':
          description: Acquired lease
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameControllerAcquisition'
  /game-controller/renew:
    parameters:
      - $ref: '#/components/parameters/GameControllerEpoch'
    post:
      operationId: renewGameController
      summary: Renew the lease held with the given epoch
      tags:
        - Game Controller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameControllerInstance'
      responses:
        '200':
          description: Renewed lease
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameControllerLease'
        '423':
          description: The lease expired, was taken over or ended with a server restart
          content: {}
  /game-controller/release:
    parameters:
      - $ref: '#/components/parameters/GameControllerEpoch'
    post:
      operationId: releaseGameController
      summary: Release the lease; releasing an ended lease is a no-op
      tags:
        - Game Controller
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Lease after the release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameControllerLease'
  /game-controller/session:
    parameters:
      - $ref: '#/components/parameters/GameControllerEpoch'
    put:
      operationId: putGameControllerSession
      summary: Set the stored session the controller executes (null stops execution)
      tags:
        - Game Controller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameControllerSession'
      responses:
        '200':
          description: Updated lease
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameControllerLease'
        '423':
          description: The game controller lease is required, or another Tool instance holds it
          content: {}
  /game-controller/history:
    get:
      operationId: getGameControllerHistory
      summary: Acquisitions, releases, expiries, takeovers, restarts, execution changes and unfenced edits
      tags:
        - Game Controller
      parameters:
        - name: before
          in: query
          description: Cursor returned as nextCursor by the previous page (newest first)
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameControllerHistoryPage'
components:
  responses:
    BadRequest:
      description: Invalid input, or a reference to a row that does not exist
    Forbidden:
      description: Administrator access required
    NoMembership:
      description: The account does not take part in a game, or its role may not use this
    NotFound:
      description: Unknown session or row
    Conflict:
      description: A conflict with a game rule, the stored state or a revision
    Refused:
      description: The change would let a hunter see a real participant tracker
    Locked:
      description: The game controller lease is required (X-Game-Controller-Epoch)
    Session:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GameSession'
    Member:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GameMember'
    Resource:
      description: OK
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/GameMirror'
              - $ref: '#/components/schemas/GameGroup'
              - $ref: '#/components/schemas/GameGeofence'
    Document:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GameDocument'
    Revision:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GameRevision'
    Checkpoint:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GameCheckpoint'
    Request:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GameRequest'
    NotificationState:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GameNotificationState'
    Proximity:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GameProximitySnapshot'
  schemas:
    Position:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique position record identifier
        deviceId:
          type: integer
          format: int64
          description: Identifier of the device that reported this position
        protocol:
          type: string
          description: Device protocol name that produced the message
        deviceTime:
          type: string
          description: in ISO 8601 format. eg. `1963-11-22T18:30:00Z`
          format: date-time
        fixTime:
          type: string
          description: in ISO 8601 format. eg. `1963-11-22T18:30:00Z`
          format: date-time
        serverTime:
          type: string
          description: in ISO 8601 format. eg. `1963-11-22T18:30:00Z`
          format: date-time
        valid:
          type: boolean
          description: Indicates whether the position was marked as valid by the device
        latitude:
          type: number
          description: Latitude in decimal degrees
        longitude:
          type: number
          description: Longitude in decimal degrees
        altitude:
          type: number
          description: Altitude above sea level in meters
        speed:
          type: number
          description: in knots
        course:
          type: number
          description: Heading in degrees (0-360) where 0 is true north
        address:
          type: string
          description: Resolved reverse-geocoded address if available
        accuracy:
          type: number
          description: Estimated positional accuracy in meters when provided
        network:
          type: object
          description: Network metadata (e.g. cell or Wi‑Fi data) supplied by the device
          properties: {}
        geofenceIds:
          type: array
          items:
            type: integer
          description: List of geofence ids applicable to this position
        attributes:
          type: object
          description: Custom key-value attributes sent by the device or enrichments
          properties: {}
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique user identifier
        name:
          type: string
          description: User display name
        email:
          type: string
          description: Email address used for login and notifications
        phone:
          type: [string, 'null']
          description: Contact phone number for alerts
        readonly:
          type: boolean
          description: When true, the user cannot change settings
        administrator:
          type: boolean
          description: Grants full administrative privileges when enabled
        map:
          type: [string, 'null']
          description: Preferred default map layer for the user
        latitude:
          type: number
          description: Default map center latitude for this user
        longitude:
          type: number
          description: Default map center longitude for this user
        zoom:
          type: integer
          description: Default map zoom level on login
        password:
          type: string
          description: Password for user authentication
        coordinateFormat:
          type: [string, 'null']
          description: Preferred coordinate display format
        disabled:
          type: boolean
          description: Indicates whether the user account is disabled
        expirationTime:
          type: [string, 'null']
          description: in ISO 8601 format. eg. `1963-11-22T18:30:00Z`
          format: date-time
        deviceLimit:
          type: integer
          description: Maximum number of devices the user can manage
        userLimit:
          type: integer
          description: Maximum number of subordinate users
        deviceReadonly:
          type: boolean
          description: Restricts user from modifying device attributes
        limitCommands:
          type: boolean
          description: Prevents user from sending unsupported commands
        disableDrawings:
          type: boolean
          description: Prevents the user from creating or changing map drawings
        fixedEmail:
          type: boolean
          description: Locks the email field to avoid changes
        poiLayer:
          type: [string, 'null']
          description: External POI layer configured for the user
        attributes:
          type: object
          description: Additional custom user attributes
          properties: {}
    Server:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique server configuration identifier
        registration:
          type: boolean
          description: Whether new user registrations are allowed
        readonly:
          type: boolean
          description: When true only administrators can modify server-wide settings
        deviceReadonly:
          type: boolean
          description: Disallow device attribute changes for non-admins
        limitCommands:
          type: boolean
          description: Restrict command execution to supported protocol commands
        map:
          type: string
          description: Default map layer identifier
        bingKey:
          type: string
          description: Bing Maps API key used when Bing is selected as a provider
        mapUrl:
          type: string
          description: Custom tile server URL template if configured
        poiLayer:
          type: string
          description: External point-of-interest layer configuration
        announcement:
          type: string
          description: Message displayed to all users in the web application
        latitude:
          type: number
          description: Default map center latitude
        longitude:
          type: number
          description: Default map center longitude
        zoom:
          type: integer
          description: Default map zoom level
        version:
          type: string
          description: Traccar server version string
        forceSettings:
          type: boolean
          description: Forces users to use the server-wide settings instead of their own
        coordinateFormat:
          type: string
          description: Default coordinate format for displaying positions
        openIdEnabled:
          type: boolean
          description: Indicates whether OpenID authentication is available
        openIdForce:
          type: boolean
          description: Require OpenID authentication for all users when enabled
        attributes:
          type: object
          description: Additional server-level configuration values
          properties: {}
    Command:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique saved command identifier
        deviceId:
          type: integer
          format: int64
          description: Target device identifier when the command is bound to one device
        description:
          type: string
          description: User friendly label displayed in the UI
        type:
          type: string
          description: Command type as defined by the device protocol
        textChannel:
          type: boolean
          description: Whether to send the command using the SMS channel
        attributes:
          type: object
          description: Additional parameters required by the command type
          properties: {}
    QueuedCommand:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Identifier of the queued command job
        deviceId:
          type: integer
          format: int64
          description: Device identifier the queued command will be delivered to
        type:
          type: string
          description: Command type that will be executed
        textChannel:
          type: boolean
          description: Indicates whether the queued command uses SMS delivery
        attributes:
          type: object
          description: Stored parameters for the queued command
          properties: {}
    Device:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier assigned by Traccar
        name:
          type: string
          description: Human friendly device label
        uniqueId:
          type: string
          description: Hardware or protocol specific unique identifier
        status:
          type: string
          description: Current connection status such as `online`, `offline`, or `unknown`
        disabled:
          type: boolean
          description: Whether the device is disabled by an administrator
        lastUpdate:
          type: [string, 'null']
          description: in ISO 8601 format. eg. `1963-11-22T18:30:00Z`
          format: date-time
        positionId:
          type: [integer, 'null']
          format: int64
          description: Identifier of the last known position
        groupId:
          type: [integer, 'null']
          format: int64
          description: Parent group identifier when the device is assigned to a group
        phone:
          type: [string, 'null']
          description: Contact phone number used for SMS commands
        model:
          type: [string, 'null']
          description: Device model or hardware revision
        contact:
          type: [string, 'null']
          description: Responsible person's contact information
        category:
          type: [string, 'null']
          description: Free form category used for grouping devices in the UI
        attributes:
          type: object
          description: Custom attributes for protocol or business specific data
          properties: {}
    Group:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique group identifier
        name:
          type: string
          description: Group display name
        groupId:
          type: integer
          format: int64
          description: Parent group identifier for nested grouping
        attributes:
          type: object
          description: Arbitrary metadata attached to the group
          properties: {}
    Permission:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          description: User id, can be only first parameter
        deviceId:
          type: integer
          format: int64
          description: >-
            Device id, can be first parameter or second only in combination with
            userId
        groupId:
          type: integer
          format: int64
          description: >-
            Group id, can be first parameter or second only in combination with
            userId
        geofenceId:
          type: integer
          format: int64
          description: Geofence id, can be second parameter only
        notificationId:
          type: integer
          format: int64
          description: Notification id, can be second parameter only
        calendarId:
          type: integer
          format: int64
          description: >-
            Calendar id, can be second parameter only and only in combination
            with userId
        attributeId:
          type: integer
          format: int64
          description: Computed attribute id, can be second parameter only
        driverId:
          type: integer
          format: int64
          description: Driver id, can be second parameter only
        managedUserId:
          type: integer
          format: int64
          description: >-
            User id, can be second parameter only and only in combination with
            userId
        commandId:
          type: integer
          format: int64
          description: Saved command id, can be second parameter only
      description: >-
        This is a permission map that contain two object indexes. It is used to
        link/unlink objects. Order is important. Example: { deviceId:8,
        geofenceId: 16 }
    CommandType:
      type: object
      properties:
        type:
          type: string
          description: Command type identifier
    Drawing:
      type: object
      required:
        - type
        - geometry
        - color
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: Unique drawing identifier
        ownerId:
          type: integer
          format: int64
          readOnly: true
          description: Identifier of the user that owns the drawing
        ownerName:
          type: string
          readOnly: true
          description: Current display name of the drawing owner
        type:
          type: string
          enum: [line, arrow, polygon, rectangle, circle, text]
        geometry:
          type: object
          description: WGS84 GeoJSON geometry appropriate for the drawing type
          required:
            - type
            - coordinates
          properties:
            type:
              type: string
              enum: [Point, LineString, Polygon]
            coordinates:
              type: array
              items: {}
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        text:
          type: [string, 'null']
          maxLength: 200
          description: Multiline label used by text drawings
        textSize:
          type: integer
          enum: [12, 16, 24, 32]
          default: 16
          description: Font size in screen pixels for text drawings
        textBold:
          type: boolean
          default: false
