        decidedAt:
          $ref: '#/components/schemas/NullableTime'
        completedAt:
          $ref: '#/components/schemas/NullableTime'
        updatedAt:
          $ref: '#/components/schemas/NullableTime'
    GameRequestSubmission:
      type: object
      required: [type]
      properties:
        type:
          type: string
        targetMemberId:
          $ref: '#/components/schemas/NullableId'
        baseRevision:
          type: [integer, 'null']
          description: The target's member state revision (hunters' speedhunt actions)
        parameters:
          type: [object, 'null']
          description: >-
            jokerFakePing - latitude, longitude and either entryId or pingNumber (with runToken for a running
            speedhunt); jokerBreak - optional startsAt; speedhunt pings - optional confirmConsecutive
    GameRequestDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [await, approve, reject]
        message:
          type: [string, 'null']
        detail:
          type: [string, 'null']
    GameJokerInventory:
      type: object
      properties:
        memberId:
          $ref: '#/components/schemas/NullableId'
        type:
          type: string
          enum: [hunterPositions, fakePing, break, speedhunt]
        granted:
          type: integer
        used:
          type: integer
        reserved:
          type: integer
        available:
          type: integer
        overAllocated:
          type: integer
    GameJokerReservation:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        memberId:
          $ref: '#/components/schemas/NullableId'
        type:
          type: string
        requestId:
          $ref: '#/components/schemas/NullableId'
        status:
          type: string
          enum: [reserved, consumed, released]
        armed:
          type: boolean
        overAllocated:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Time'
        use:
          type: string
          enum: [timetable, speedhunt, runningSpeedhunt, plannedBreak]
        fake:
          type: object
          properties:
            latitude:
              type: number
            longitude:
              type: number
            entryId:
              $ref: '#/components/schemas/Id'
            scheduledAt:
              $ref: '#/components/schemas/Time'
            pingNumber:
              type: integer
            bound:
              type: boolean
            boundRunId:
              $ref: '#/components/schemas/Id'
              description: Operators only; opaque to owners
        plannedBreak:
          type: object
          properties:
            breakId:
              $ref: '#/components/schemas/Id'
            startsAt:
              $ref: '#/components/schemas/Time'
            state:
              type: string
            plannedBy:
              type: string
    GameJokerOverview:
      type: object
      properties:
        inventories:
          type: array
          items:
            $ref: '#/components/schemas/GameJokerInventory'
        reservations:
          type: array
          items:
            $ref: '#/components/schemas/GameJokerReservation'
        boundFakes:
          type: array
          items:
            $ref: '#/components/schemas/GameJokerReservation'
    GameOwnJokers:
      type: object
      description: The hunters' pool has only the speedhunt inventory and no timetable entries
      properties:
        inventories:
          type: array
          items:
            $ref: '#/components/schemas/GameJokerInventory'
        reservations:
          type: array
          items:
            $ref: '#/components/schemas/GameJokerReservation'
        timetableEntries:
          type: array
          items:
            type: object
            properties:
              entryId:
                $ref: '#/components/schemas/Id'
              scheduledAt:
                $ref: '#/components/schemas/Time'
              taken:
                type: boolean
        pingsPerSpeedhunt:
          type: [integer, 'null']
    GameJokerLedgerEntry:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        memberId:
          $ref: '#/components/schemas/NullableId'
        type:
          type: string
        kind:
          type: string
          enum: [grant, revoke, reserve, arm, use, overuse, release]
        quantity:
          type: integer
        requestId:
          $ref: '#/components/schemas/NullableId'
        reservationId:
          $ref: '#/components/schemas/NullableId'
        actor:
          type: [string, 'null']
        detail:
          type: [string, 'null']
        occurredAt:
          $ref: '#/components/schemas/Time'
    GameJokerDiscrepancy:
      type: object
      properties:
        memberId:
          $ref: '#/components/schemas/NullableId'
        type:
          type: string
        field:
          type: string
        stored:
          type: integer
        expected:
          type: integer
    GameJokerChange:
      type: object
      required: [type, quantity]
      properties:
        memberId:
          $ref: '#/components/schemas/NullableId'
          description: Null for the hunters' pool (speedhunt jokers)
        type:
          type: string
          enum: [hunterPositions, fakePing, break, speedhunt]
        quantity:
          type: integer
          minimum: -1000
          maximum: 1000
        reason:
          type: [string, 'null']
    GameBreakPlan:
      type: object
      required: [memberId]
      properties:
        memberId:
          $ref: '#/components/schemas/Id'
        startsAt:
          $ref: '#/components/schemas/NullableTime'
        overAllocate:
          type: [boolean, 'null']
    GameOperation:
      type: object
      required: [type]
      description: >-
        One typed state operation; the server validates each transition against the row's current state and answers
        409 for an illegal one. Ping sources are real or operatorFake; the server stores jokerFake when the target's
        own fake applies.
      properties:
        type:
          type: string
          enum: [catch, release, pingDelivered, pingFailed, runEnded, liveUploadStarted, liveUploadSample,
                 liveUploadEnded, breakPlanned, breakWaiting, breakStarted, breakEnded, breakCancelled, breakMissed,
                 fakeUsed, fakeReleased, checkpoint]
      additionalProperties: true
    GameEffectsDelivery:
      type: object
      required: [deliveryId]
      properties:
        deliveryId:
          type: string
          pattern: '^[A-Za-z0-9_-]{8,64}$'
        positions:
          type: [array, 'null']
          maxItems: 200
          items:
            type: object
            properties:
              deviceId:
                $ref: '#/components/schemas/NullableId'
              uniqueId:
                type: [string, 'null']
              latitude:
                type: number
              longitude:
                type: number
              fixTime:
                $ref: '#/components/schemas/NullableTime'
              attributes:
                type: [object, 'null']
              fakeReservationId:
                $ref: '#/components/schemas/NullableId'
              fallbackLatitude:
                type: [number, 'null']
              fallbackLongitude:
                type: [number, 'null']
        operations:
          type: [array, 'null']
          maxItems: 200
          items:
            $ref: '#/components/schemas/GameOperation'
        notifications:
          type: [object, 'null']
          properties:
            generation:
              type: string
              format: uuid
            alerts:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/GameNotificationAlert'
        pushes:
          type: [array, 'null']
          maxItems: 500
          items:
            type: object
            required: [memberId, message]
            properties:
              memberId:
                $ref: '#/components/schemas/Id'
              subject:
                type: [string, 'null']
              message:
                type: string
              notificator:
                type: [string, 'null']
              alertId:
                type: [string, 'null']
        logs:
          type: [array, 'null']
          items:
            type: object
            properties:
              category:
                type: string
              occurredAt:
                $ref: '#/components/schemas/Time'
              message:
                type: string
        requests:
          type: [array, 'null']
          items:
            type: object
            required: [id, status]
            properties:
              id:
                $ref: '#/components/schemas/Id'
              status:
                type: string
                enum: [succeeded, failed, rejected]
              message:
                type: [string, 'null']
              detail:
                type: [string, 'null']
        jokers:
          type: [array, 'null']
          description: Operator uses of "Get hunter positions" jokers
          items:
            type: object
            properties:
              memberId:
                $ref: '#/components/schemas/Id'
              type:
                type: string
                const: hunterPositions
              overAllocate:
                type: [boolean, 'null']
              detail:
                type: [string, 'null']
    GameEffectsOutcome:
      type: object
      description: The recorded outcome of a delivery (operator data; it names joker fakes)
      properties:
        deliveryId:
          type: string
        replayed:
          type: boolean
        epoch:
          type: integer
        positions:
          type: array
          items:
            type: object
        operations:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              operation:
                type: string
              id:
                $ref: '#/components/schemas/Id'
              runId:
                $ref: '#/components/schemas/Id'
              number:
                type: integer
              source:
                type: string
              status:
                type: string
        generation:
          type: [string, 'null']
        alerts:
          type: array
          items:
            type: object
        pushes:
          type: array
          items:
            type: object
        requests:
          type: array
          items:
            type: object
        jokers:
          type: array
          items:
            type: object
        fakes:
          type: array
          items:
            type: object
            properties:
              reservationId:
                $ref: '#/components/schemas/Id'
              status:
                type: string
        sessionRevision:
          type: integer
    GameSnapshot:
      type: object
      description: >-
        Operator data at one database snapshot. state holds every catch interval, every run with its pings (newest
        first, with ping sources), every break and live upload, the member state revisions by member ID and the
        per-member speedhunt statistics; requests are the open ones; fakePlans the plans of reserved fake ping
        jokers.
      properties:
        gameSessionId:
          $ref: '#/components/schemas/Id'
        revision:
          type: integer
          description: The session aggregate revision
        readAt:
          $ref: '#/components/schemas/Time'
        executingEpoch:
          type: [integer, 'null']
        session:
          $ref: '#/components/schemas/GameSession'
        members:
          type: array
          items:
            $ref: '#/components/schemas/GameMember'
        resources:
          $ref: '#/components/schemas/GameResources'
        state:
          type: object
          properties:
            catches:
              type: array
              items:
                type: object
            runs:
              type: array
              items:
                type: object
                properties:
                  run:
                    type: object
                  pings:
                    type: array
                    items:
                      type: object
            breaks:
              type: array
              items:
                type: object
            liveUploads:
              type: array
              items:
                type: object
            memberRevisions:
              type: object
              additionalProperties:
                type: integer
            statistics:
              type: array
              items:
                type: object
        requests:
          type: array
          items:
            $ref: '#/components/schemas/GameRequest'
        jokers:
          $ref: '#/components/schemas/GameJokerOverview'
        fakePlans:
          type: array
          items:
            type: object
        timetable:
          $ref: '#/components/schemas/GameTimetable'
        geofencePlans:
          $ref: '#/components/schemas/GameDocument'
        checkpoints:
          type: array
          items:
            $ref: '#/components/schemas/GameCheckpoint'
        notifications:
          oneOf:
            - $ref: '#/components/schemas/GameNotificationState'
            - type: 'null'
        proximity:
          $ref: '#/components/schemas/GameProximitySnapshot'
    GameStatus:
      type: object
      description: >-
        The caller's membership, whether a Tool controls the game, the server time for countdowns, a hash of the
        projection (it changes only with what this member observes; members never see the session revision) and the
        role projection.
      properties:
        gameSessionId:
          $ref: '#/components/schemas/Id'
        memberId:
          $ref: '#/components/schemas/Id'
        role:
          $ref: '#/components/schemas/Role'
        number:
          type: integer
        displayName:
          type: string
        controllerActive:
          type: boolean
        serverTime:
          $ref: '#/components/schemas/Time'
        hash:
          type: string
          pattern: '^[0-9a-f]{32}$'
        status:
          description: The projection of the caller's role
          anyOf:
            - $ref: '#/components/schemas/GamePlayerView'
            - $ref: '#/components/schemas/GameHunterView'
            - $ref: '#/components/schemas/GameSpectatorView'
    GameSpeedhuntProgress:
      type: object
      description: >-
        The current speedhunt without its target, the same for every member; inactive while no Tool controls the
        game. pingCount and pingLimit are left out while zero or unlimited.
      required: [active]
      properties:
        active:
          type: boolean
        pingCount:
          type: integer
        pingLimit:
          type: integer
        pingHistory:
          type: array
          items:
            $ref: '#/components/schemas/GamePingTime'
    GamePingTime:
      type: object
      properties:
        number:
          type: integer
        sentAt:
          $ref: '#/components/schemas/Time'
    GameBreak:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
        startedAt:
          $ref: '#/components/schemas/Time'
        endsAt:
          $ref: '#/components/schemas/Time'
          description: Past endsAt and still active means ending (no Tool has ended it yet)
    GamePlayerView:
      type: object
      description: Players and supporters - no revisions, sources, other members' plans or target identities
      required: [speedhunt, break, participantOverview, fakes, plannedBreaks]
      properties:
        speedhunt:
          $ref: '#/components/schemas/GameSpeedhuntProgress'
        break:
          $ref: '#/components/schemas/GameBreak'
        runningFake:
          type: object
          description: Ping slots of a running speedhunt any player or supporter may plan a fake on
          properties:
            runToken:
              type: string
              pattern: '^[0-9a-f]{32}$'
            firstPing:
              type: integer
            lastPing:
              type: integer
        participantOverview:
          type: array
          description: The catch roster - active players and supporters with a tracker
          items:
            type: object
            properties:
              memberId:
                $ref: '#/components/schemas/Id'
              role:
                type: string
                enum: [player, supporter]
              number:
                type: integer
              name:
                type: string
              caught:
                type: boolean
        fakes:
          type: array
          description: The caller's own armed fakes
          items:
            type: object
            properties:
              reservationId:
                $ref: '#/components/schemas/Id'
              use:
                type: string
                enum: [timetable, speedhunt, runningSpeedhunt]
              latitude:
                type: number
              longitude:
                type: number
              entryId:
                $ref: '#/components/schemas/Id'
              scheduledAt:
                $ref: '#/components/schemas/Time'
              pingNumber:
                type: integer
              runToken:
                type: string
        plannedBreaks:
          type: array
          description: The caller's own planned and waiting breaks
          items:
            type: object
            properties:
              breakId:
                $ref: '#/components/schemas/Id'
              reservationId:
                $ref: '#/components/schemas/NullableId'
              startsAt:
                $ref: '#/components/schemas/Time'
              state:
                type: string
                enum: [planned, waiting]
              plannedBy:
                type: string
                enum: [participant, operator]
    GameParticipant:
      type: object
      properties:
        memberId:
          $ref: '#/components/schemas/Id'
        role:
          type: string
          enum: [player, supporter]
        number:
          type: integer
        name:
          type: string
          description: Roster label for hunters (role group name and number), display name for the spectator
        trackerId:
          $ref: '#/components/schemas/Id'
          description: Spectator only
        caught:
          type: boolean
        speedhunt:
          type: object
          properties:
            running:
              type: boolean
            pings:
              type: integer
            pingHistory:
              type: array
              items:
                $ref: '#/components/schemas/GamePingTime'
            startsRun:
              type: boolean
            live:
              type: boolean
            liveUntil:
              $ref: '#/components/schemas/Time'
            revision:
              type: integer
              description: The member state revision hunter requests carry as baseRevision
        break:
          $ref: '#/components/schemas/GameBreak'
    GameLimits:
      type: object
      properties:
        pingsPerSpeedhunt:
          type: [integer, 'null']
        fixedLiveMinutes:
          type: [number, 'null']
        allowConsecutiveSpeedhunts:
          type: boolean
        limitEnforcement:
          type: string
          enum: [warn, block]
        requestApprovals:
          type: object
          properties:
            speedhuntStaticPing:
              type: boolean
            speedhuntLivePing:
              type: boolean
    GameHunterView:
      type: object
      required: [speedhunt, participants, limits, lastSpeedhuntMemberId, liveShares]
      properties:
        speedhunt:
          $ref: '#/components/schemas/GameSpeedhuntProgress'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/GameParticipant'
        limits:
          $ref: '#/components/schemas/GameLimits'
        lastSpeedhuntMemberId:
          $ref: '#/components/schemas/NullableId'
        liveShares:
          type: array
          items:
            type: object
            properties:
              memberId:
                $ref: '#/components/schemas/Id'
              name:
                type: string
              endsAt:
                $ref: '#/components/schemas/Time'
              source:
                type: string
                enum: [manual, geofence, speedhunt]
              reason:
                type: string
    GameSpectatorView:
      type: object
      description: The hunters' view with display names and real trackers, without live shares
      required: [speedhunt, participants, limits]
      properties:
        speedhunt:
          $ref: '#/components/schemas/GameSpeedhuntProgress'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/GameParticipant'
        limits:
          $ref: '#/components/schemas/GameLimits'
    GameSpeedhuntHistory:
      type: object
      properties:
        gameSessionId:
          $ref: '#/components/schemas/Id'
        runs:
          type: array
          items:
            type: object
            properties:
              runId:
                $ref: '#/components/schemas/Id'
              startedAt:
                $ref: '#/components/schemas/Time'
              status:
                type: string
                enum: [inProgress, finished]
              pings:
                type: array
                items:
                  type: object
                  properties:
                    pingId:
                      $ref: '#/components/schemas/Id'
                    number:
                      type: integer
                    sentAt:
                      $ref: '#/components/schemas/Time'
                    mode:
                      type: string
                      enum: [static, live]
    GameTimetablePing:
      type: object
      required: [entryId, scheduledAt, memberId, state]
      properties:
        entryId:
          $ref: '#/components/schemas/Id'
        scheduledAt:
          $ref: '#/components/schemas/Time'
        memberId:
          $ref: '#/components/schemas/Id'
        state:
          type: string
          enum: [scheduled, sent, skipped, failed]
        stateAt:
          $ref: '#/components/schemas/NullableTime'
        fakeAllowed:
          type: [boolean, 'null']
    GameTimetableSlot:
      type: object
      required: [scheduledAt]
      properties:
        scheduledAt:
          $ref: '#/components/schemas/Time'
    GameNotificationAlert:
      type: object
      required: [id, type, audience, occurredAt, timeZone, message]
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        type:
