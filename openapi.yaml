          type: string
          description: Human readable device name
        geofenceId:
          type: integer
          format: int64
          description: Geofence identifier
        startTime:
          type: string
          description: in ISO 8601 format. eg. `1963-11-22T18:30:00Z`
          format: date-time
        endTime:
          type: string
          description: in ISO 8601 format. eg. `1963-11-22T18:30:00Z`
          format: date-time
    ReportTrips:
      type: object
      properties:
        deviceId:
          type: integer
          format: int64
