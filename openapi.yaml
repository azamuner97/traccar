  /game-sessions/{id}/members/{memberId}/name:
    parameters:
      - $ref: '#/components/parameters/GameSessionId'
      - $ref: '#/components/parameters/GameMemberId'
    put:
      operationId: renameGameMember
      summary: Changes an active member's display name; history keeps its snapshots
      tags: [Game Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameMemberName'
      responses:
        '200':
          $ref: '#/components/responses/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
  /game-sessions/{id}/members/{memberId}/account:
    parameters:
      - $ref: '#/components/parameters/GameSessionId'
      - $ref: '#/components/parameters/GameMemberId'
    put:
      operationId: bindGameMemberAccount
      summary: Binds an account to an active member (one member of all sessions per account)
      description: >-
        A binding change revokes the member's proximity grants, ends its open requests, releases its armed plans and
        advances its member state revision, in one transaction. A change that would let a hunter see a real
        participant tracker of a session with break or fake jokers is refused with 422.
      tags: [Game Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameMemberAccount'
      responses:
        '200':
          $ref: '#/components/responses/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Refused'
        '423':
          $ref: '#/components/responses/Locked'
    delete:
      operationId: unbindGameMemberAccount
      summary: Unbinds a member's account (the way to free the spectator's account)
      tags: [Game Sessions]
      responses:
        '200':
          $ref: '#/components/responses/Member'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
  /game-sessions/{id}/members/{memberId}/tracker:
    parameters:
      - $ref: '#/components/parameters/GameSessionId'
      - $ref: '#/components/parameters/GameMemberId'
    put:
      operationId: bindGameMemberTracker
      summary: Binds a real tracker to an active member (one member per session per tracker; never a mirror)
      tags: [Game Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameMemberTracker'
      responses:
        '200':
          $ref: '#/components/responses/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Refused'
        '423':
          $ref: '#/components/responses/Locked'
    delete:
      operationId: unbindGameMemberTracker
      summary: Unbinds a member's tracker
      tags: [Game Sessions]
      responses:
        '200':
          $ref: '#/components/responses/Member'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
  /game-sessions/{id}/members/{memberId}/retire:
    parameters:
      - $ref: '#/components/parameters/GameSessionId'
      - $ref: '#/components/parameters/GameMemberId'
    post:
      operationId: retireGameMember
      summary: Retires a member, clearing its bindings and keeping its state and history; the spectator cannot be retired
      description: >-
        In the same transaction, the member's running speedhunt ends (terminated, and armed fakes on pings it did not
        reach are returned), its live uploads as source or relay recipient end, and hunters' open requests on it end,
        so nothing waits for a member that can no longer act. Its own requests and plans end as with any binding
        change.
      tags: [Game Sessions]
      responses:
        '200':
          $ref: '#/components/responses/Member'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
  /game-sessions/{id}/members/{memberId}/role:
